name: gelcrm

x-app: &app
  build: .
  image: gelcrm:local
  restart: unless-stopped
  env_file: .env
  environment:
    DEBUG: "${DEBUG:-false}"
    SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
    ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1},localhost,127.0.0.1"
    CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
    DATABASE_URL: "postgresql://gelcrm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/gelcrm"
    REDIS_URL: "redis://redis:6379/0"
    BACKUP_DIR: /app/private_backups
    BACKUP_ENCRYPTION_KEY: "${BACKUP_ENCRYPTION_KEY:-}"
    BACKUP_RETENTION: "${BACKUP_RETENTION:-5}"
  volumes:
    - backups:/app/private_backups

services:
  db:
    image: postgres:15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: gelcrm
      POSTGRES_USER: gelcrm
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gelcrm -d gelcrm"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    <<: *app
    ports:
      - "${BIND_HOST:-127.0.0.1}:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

  worker:
    <<: *app
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command: ["celery", "-A", "config.celery", "beat", "--loglevel=info", "--schedule=/tmp/gelcrm-celerybeat"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backups:
